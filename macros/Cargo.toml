[package]
name = "lez-authority-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Macros for lez-authority: the guard attribute on a handler, HasSlot from marked fields, Gated from marked messages"
repository.workspace = true
readme = "../README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
