name: audit

permissions:
  contents: read

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths:
      - "**/Cargo.lock"
      - "**/.cargo/audit.toml"
  workflow_dispatch:

jobs:
  audit:
    name: Audit, workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit against the recorded policy
        run: cargo audit

  standalone:
    name: Audit, ${{ matrix.role }} ${{ matrix.part }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [admin, freeze]
        part: [runner, methods]
    defaults:
      run:
        working-directory: lez-${{ matrix.role }}-authority/sample/${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit against the folder's policy
        run: cargo audit
