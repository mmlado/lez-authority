name: Consumer build

# The real risc0 guest builds and the runners. Slow, so on demand and weekly.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  guests:
    name: Guest build, ${{ matrix.role }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [admin, freeze]
    defaults:
      run:
        working-directory: lez-${{ matrix.role }}-authority
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Install the risc0 toolchain
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          "$HOME/.risc0/bin/rzup" install
      - name: Build the sample guest
        run: cargo build --release --locked --manifest-path sample/methods/Cargo.toml
      - name: Assert the sample program binary exists
        run: test -f sample/methods/target/riscv-guest/${{ matrix.role }}-sample-methods/${{ matrix.role }}-sample/riscv32im-risc0-zkvm-elf/release/${{ matrix.role }}-sample.bin

  fixture:
    name: Consumer fixture guest build, admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lez-admin-authority
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Install the risc0 toolchain
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          "$HOME/.risc0/bin/rzup" install
      - name: Build the consumer fixture guest
        run: cargo build --release --locked --manifest-path ci/consumer-fixture/Cargo.toml
      - name: Assert the fixture program binary exists
        run: test -f ci/consumer-fixture/target/riscv-guest/consumer-fixture-methods/consumer-fixture-guest/riscv32im-risc0-zkvm-elf/release/consumer_fixture.bin

  runners:
    name: Runner build, ${{ matrix.role }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [admin, freeze]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      # The LEZ wallet crate links pcsc.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lez-${{ matrix.role }}-authority/sample/runner
      - name: Build the runner
        run: cargo build --release --locked --manifest-path lez-${{ matrix.role }}-authority/sample/runner/Cargo.toml
