name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Prefetch dependency sources
        run: cargo fetch --locked
      # The runners and the guests resolve through locks of their own, which the root steps never read.
      - name: Standalone locks are current
        run: |
          for m in lez-admin-authority/sample/runner lez-freeze-authority/sample/runner lez-admin-authority/sample/methods lez-freeze-authority/sample/methods; do
            cargo fetch --locked --manifest-path "$m/Cargo.toml"
          done
      # Nothing in the root workspace pins risc0 as LEZ does, so only this keeps the guests on the sequencer's version.
      - name: The guests link the sequencer's risc0
        run: |
          risc0() { grep -A1 -E '^name = "risc0-(zkvm|zkos-v1compat)"$' "$1"; }
          for m in lez-admin-authority/sample/runner lez-freeze-authority/sample/runner lez-admin-authority/sample/methods lez-freeze-authority/sample/methods; do
            diff <(risc0 Cargo.lock) <(risc0 "$m/Cargo.lock")
          done
      - name: Formatting
        run: |
          cargo fmt --all --check
          cargo fmt --check --manifest-path lez-admin-authority/sample/runner/Cargo.toml
          cargo fmt --check --manifest-path lez-freeze-authority/sample/runner/Cargo.toml
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Tests
        run: cargo test --workspace --locked
      - name: No role crate in the engine's dependency tree
        run: |
          cargo tree --locked -p lez-authority -p lez-authority-macros -e normal,build,dev --target all --prefix none > "$RUNNER_TEMP/engine-tree.txt"
          if grep -E '^lez-[a-z0-9-]+-authority' "$RUNNER_TEMP/engine-tree.txt"; then exit 1; fi

  consumer-check:
    name: Consumer fixture host check, admin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lez-admin-authority/ci/consumer-fixture/guest
      - name: Prefetch dependency sources
        run: cargo fetch --locked --manifest-path lez-admin-authority/ci/consumer-fixture/guest/Cargo.toml
      - name: Check the consumer fixture on the host
        run: cargo check --locked --manifest-path lez-admin-authority/ci/consumer-fixture/guest/Cargo.toml
