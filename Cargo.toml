[package]
name = "lez-authority"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Authority primitives for LEZ actor programs: the holder slot, the vouched caller, and the routing between a sender's own actor and the program's config actor"
repository = "https://github.com/mmlado/lez-authority"
readme = "README.md"

[dependencies]
borsh = { version = "1", features = ["derive"] }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", rev = "7e3f7f765371c4110a1f7f37baf520cd253fb339" }
