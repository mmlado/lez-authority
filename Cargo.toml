[package]
name = "lez-authority"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authority primitives for LEZ actor programs: the holder slot, the vouched caller, and the routing between a sender's own actor and the program's config actor"
repository.workspace = true
readme = "README.md"

[workspace]
members = [
    "core",
    "macros",
    "fixtures/lez-sample-authority",
    "fixtures/by-name",
    "fixtures/renamed",
    "fixtures/inherited",
    "fixtures/build-script",
    "lez-admin-authority/lez-admin-authority",
    "lez-admin-authority/lez-admin-authority-macros",
    "lez-admin-authority/sample",
    "lez-admin-authority/sample/core",
    "lez-admin-authority/sample-minimal",
    "lez-freeze-authority/lez-freeze-authority",
    "lez-freeze-authority/sample",
    "lez-freeze-authority/sample/core",
    "lez-freeze-authority/sample-minimal",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mmlado/lez-authority"

[workspace.dependencies]
borsh = { version = "1", features = ["derive"] }
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone", tag = "v0.4.0-rc3" }
lez-authority = { path = "." }
lez-authority-core = { path = "core" }
lez-admin-authority = { path = "lez-admin-authority/lez-admin-authority" }
lez-freeze-authority = { path = "lez-freeze-authority/lez-freeze-authority" }
# Only fixtures/inherited uses it, to check a role crate renamed in the workspace root.
inherited-role = { package = "lez-sample-authority", path = "fixtures/lez-sample-authority" }

[dependencies]
borsh.workspace = true
lee_core.workspace = true
lez-authority-core.workspace = true
lez-authority-macros = { path = "macros" }
# The sha256 lee_core hashes PDAs with, which a risc0 guest runs accelerated.
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
