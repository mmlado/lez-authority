[package]
name = "lez-admin-authority-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The admin attribute: lez-authority's guard on a plain LEZ handler, with the admin as the program's role"
repository = "https://github.com/mmlado/lez-admin-authority"
readme = "../README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
