# cargo-audit policy. Every ignored advisory arrives through the pinned LEZ
# dependencies, lee_core for the library and the wallet stack for the runner,
# and is not selectable from this workspace. Revisit on every LEZ pin bump.
[advisories]
ignore = [
    "RUSTSEC-2025-0055", # tracing-subscriber 0.2 ANSI log poisoning, via risc0-zkvm -> lee_core
    "RUSTSEC-2024-0388", # derivative unmaintained, arkworks provenance
    "RUSTSEC-2024-0436", # paste unmaintained, arkworks provenance
    "RUSTSEC-2023-0071", # rsa Marvin timing side channel, via the LEZ wallet stack
    "RUSTSEC-2026-0118", # hickory-proto NSEC3 unbounded loop, via the LEZ wallet stack
    "RUSTSEC-2026-0119", # hickory-proto name compression CPU exhaustion, via the LEZ wallet stack
    "RUSTSEC-2026-0487", # hickory-proto SVCB alpn parse panic, via the LEZ wallet stack
    "RUSTSEC-2026-0489", # hickory-proto SVCB quote parse panic, via the LEZ wallet stack
    "RUSTSEC-2026-0490", # hickory-proto zone lexer long-token panic, via the LEZ wallet stack
    "RUSTSEC-2026-0491", # hickory-proto header record-count memory amplification, via the LEZ wallet stack
    "RUSTSEC-2026-0387", # crypto-bigint timing variability, via the LEZ wallet stack
    "RUSTSEC-2025-0141", # bincode 1 unmaintained, via the LEZ wallet stack
    "RUSTSEC-2024-0449", # unsafe-libyaml unmaintained, via the LEZ wallet stack
    # Fixed only under libp2p 0.57, and logos-blockchain still pins libp2p 0.56.
    "RUSTSEC-2026-0504", # hickory-proto inverted NSEC3 comparison, via the LEZ wallet stack
    "RUSTSEC-2026-0505", # hickory-proto NSEC3 owner names not checked, via the LEZ wallet stack
    "RUSTSEC-2026-0511", # hickory-proto NXDOMAIN for an empty non-terminal, via the LEZ wallet stack
    "RUSTSEC-2026-0512", # hickory-proto unrelated signed RRset accepted, via the LEZ wallet stack
    "RUSTSEC-2026-0530", # hickory-proto parent-side NSEC at a zone cut, via the LEZ wallet stack
    "RUSTSEC-2026-0531", # hickory-proto child-side NSEC as a no-DS proof, via the LEZ wallet stack
    "RUSTSEC-2026-0532", # hickory-proto parent-side NSEC3 at a zone cut, via the LEZ wallet stack
    "RUSTSEC-2026-0549", # hickory-proto NSEC3 NODATA at a zone apex, via the LEZ wallet stack
    "RUSTSEC-2026-0550", # hickory-proto unsigned NSEC in a nonexistence proof, via the LEZ wallet stack
    "RUSTSEC-2026-0551", # hickory-proto records of another DNS class marked secure, via the LEZ wallet stack
    "RUSTSEC-2026-0514", # hickory-resolver returned records that failed DNSSEC, via the LEZ wallet stack
    "RUSTSEC-2026-0534", # libp2p-gossipsub unbounded PRUNE backoff state, via the LEZ wallet stack
]
